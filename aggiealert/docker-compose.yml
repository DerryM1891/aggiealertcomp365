version: "3.3"
services:
  aggiealert:
    build: .
    ports:
      # bound to localhost on purpose: the batch endpoint spends API credit
      - "127.0.0.1:8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
    volumes:
      # saved Gemini results survive container rebuilds
      - ./data/llm:/app/data/llm
